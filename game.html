<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>She Runs — o jogo</title>
<meta name="description" content="Side-scroller em pixel art: escolha uma pioneira da computação, atravesse os obstáculos reais da carreira e enfrente o chefe da própria época.">
<meta name="theme-color" content="#0b0a14">
<!-- "adicionar à tela de início" no iOS abre sem a barra do Safari (o jeito
     mais confiável de ficar em tela cheia — a Fullscreen API sozinha não
     funciona em aba normal do Safari no iPhone) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="She Runs">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0a14; --panel:#151327; --line:#2e2a4d;
  --text:#e8e6f5; --dim:#9490b8;
  --good:#5ddc9c; --gold:#f7c343; --bad:#ff5d6c; --cyan:#4cc9f0; --violet:#c77dff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);height:100%;overflow:hidden;
  font-family:'Press Start 2P',monospace;color:var(--text);
  -webkit-user-select:none;user-select:none;touch-action:none}
/* iOS Safari: 100vh conta a altura como se a barra de endereço já tivesse
   sumido, mesmo com ela visível — isso empurra os controles pra fora da
   tela. 100svh usa a altura real e visível, com fallback pra vh onde não existe. */
html,body{height:100vh}
@supports (height:100svh){ html,body{height:100svh} }
#wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:10px;padding:8px;
  padding-left:calc(8px + env(safe-area-inset-left));
  padding-right:calc(8px + env(safe-area-inset-right));
  padding-bottom:calc(8px + env(safe-area-inset-bottom))}
/* uma única largura pra tudo (barra do topo, canvas, botões) — assim as bordas
   sempre batem exatas, em vez de cada elemento calcular seu próprio min() e
   às vezes sobrar um pouco de um lado */
:root{ --game-w:min(1300px, 98vw, calc((100vh - 128px) * 1.7763)); }
@supports (height:100svh){ :root{ --game-w:min(1300px, 98vw, calc((100svh - 128px) * 1.7763)); } }
@media (max-height:480px){
  :root{ --game-w:min(1300px, 98vw, calc((100vh - 56px) * 1.7763)); }
  @supports (height:100svh){ :root{ --game-w:min(1300px, 98vw, calc((100svh - 56px) * 1.7763)); } }
}
#topbar{display:flex;justify-content:space-between;align-items:center;width:var(--game-w)}
#topbar a{color:var(--dim);text-decoration:none;font-size:.5rem;border:2px solid var(--line);
  background:var(--panel);padding:8px 12px}
#topbar a:hover{color:var(--violet);border-color:var(--violet)}
/* mesmo estilo de contorno arco-íris do título da timeline: várias sombras de
   texto pequenas em 8 direções seguindo cada letra + hue-rotate girando */
.logo{font-size:.6rem;color:#fff;letter-spacing:.02em;
  text-shadow:
    2px 2px 0 #6b3fd4,
    0 -1.3px 2px #ff3b6f, 1.2px -1px 2px #ff9d3f, 1.6px 0 2px #f7e343,
    1.2px 1px 2px #5ddc9c, 0 1.3px 2px #4cc9f0, -1.2px 1px 2px #7b6bff,
    -1.6px 0 2px #c77dff, -1.2px -1px 2px #ff5df0;
  animation:hueSpin 5s linear infinite}
@keyframes hueSpin{ 0%{filter:hue-rotate(0deg)} 100%{filter:hue-rotate(360deg)} }
/* moldura fina que gira em arco-íris — aplicada nos quadros de UI ao redor do jogo */
@property --frame-a{ syntax:'<angle>'; inherits:false; initial-value:0deg; }
.rainbowFrame{
  border:3px solid transparent;
  border-image:conic-gradient(from var(--frame-a),#ff3b6f,#ff9d3f,#f7e343,#5ddc9c,#4cc9f0,#7b6bff,#c77dff,#ff3b6f) 1;
  animation:frameSpin 5s linear infinite;
}
/* versão discreta pro canvas: bem mais fina e translúcida, não chama atenção pro limite */
.rainbowFrameThin{
  border:1.5px solid transparent;
  border-image:conic-gradient(from var(--frame-a),
    rgba(255,59,111,.55),rgba(255,157,63,.55),rgba(247,227,67,.55),rgba(93,220,156,.55),
    rgba(76,201,240,.55),rgba(123,107,255,.55),rgba(199,125,255,.55),rgba(255,59,111,.55)) 1;
  animation:frameSpin 5s linear infinite;
}
@keyframes frameSpin{ to{ --frame-a:360deg } }
/* 1080x608 internos. Em telas curtas (celular), a largura disponível deixa de ser
   o limite — usamos também a altura disponível, senão o jogo fica minúsculo. */
#gameCanvas{
  box-shadow:0 0 40px rgba(199,125,255,.15), 0 0 0 1px rgba(199,125,255,.2);
  width:var(--game-w);
  height:auto}
#touchBar{display:none;gap:8px;width:100%;max-width:var(--game-w)}
#touchBar button{flex:1;background:var(--panel);border:2px solid var(--violet);
  color:var(--text);font-family:inherit;font-size:.55rem;padding:16px 8px;cursor:pointer;
  box-shadow:0 0 10px rgba(199,125,255,.4)}
#touchBar button:active{background:var(--line)}
/* especial é a única ação com semântica própria (a habilidade, não movimento) —
   por isso é o único botão que foge do violeta padrão, em dourado, igual ao
   destaque de habilidade já usado no card de seleção de personagem */
#touchBar #btnSkill{border-color:var(--gold);box-shadow:0 0 10px rgba(247,195,67,.4)}
@media (pointer:coarse){ #touchBar{display:flex} }
/* telas baixas (celular deitado): compacta o topo e os botões pra sobrar mais altura pro jogo */
@media (max-height:480px){
  #wrap{gap:5px;padding-top:4px;padding-bottom:calc(4px + env(safe-area-inset-bottom))}
  #topbar{display:none}
  #touchBar button{padding:8px 6px;font-size:.45rem}
}

#rotatePrompt{display:none}
@media (max-width:860px) and (orientation:portrait){
  #wrap{display:none}
  #rotatePrompt{display:flex}
}
#rotatePrompt{position:fixed;inset:0;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;background:var(--bg);text-align:center;padding:24px}
#rotatePrompt .icon{font-size:3rem;animation:rotHint 1.6s ease-in-out infinite}
#rotatePrompt p{font-size:.75rem;line-height:1.8;color:var(--text)}
#rotatePrompt p.sub{font-size:.6rem;color:var(--dim)}
@keyframes rotHint{0%,100%{transform:rotate(0deg)}50%{transform:rotate(90deg)}}
/* botões flutuantes de canto (ranking / voltar) — mesmo violeta e mesmo brilho
   dos botões circulares, só que em formato de chip (precisam de texto) */
#lbEntryBtn,#backBtn{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top));
  z-index:6;font-family:inherit;font-size:.5rem;
  background:var(--panel);border:2px solid var(--violet);color:var(--text);padding:9px 12px;cursor:pointer;
  box-shadow:0 0 10px rgba(199,125,255,.4)}
#lbEntryBtn{right:calc(10px + env(safe-area-inset-right))}
#backBtn{left:calc(10px + env(safe-area-inset-left))}
#lbEntryBtn:active,#backBtn:active{background:var(--line)}
@media (pointer:coarse){ #lbEntryBtn,#backBtn{font-size:.42rem;padding:8px 10px} }
/* setas de trocar personagem — só no mobile, cantos livres da tela de seleção.
   Mesmo círculo/brilho violeta do resto dos controles flutuantes (touchBar,
   ranking, voltar) — um único sistema visual, não um botão por estilo. */
#charNavBar{display:none}
@media (pointer:coarse){
  #charNavBar{position:fixed;inset:0;pointer-events:none;display:block}
  #charNavBar button{position:absolute;pointer-events:auto;top:50%;transform:translateY(-50%);
    width:56px;height:56px;border-radius:50%;font-family:inherit;font-size:1.1rem;
    background:var(--panel);border:2px solid var(--violet);color:var(--text);
    box-shadow:0 0 10px rgba(199,125,255,.4)}
  #charNavBar button:active{background:var(--line)}
  #btnCharPrev{left:calc(8px + env(safe-area-inset-left))}
  #btnCharNext{right:calc(8px + env(safe-area-inset-right))}
}
#endBar{display:none;gap:8px;width:var(--game-w);justify-content:center;flex-wrap:wrap}
#endBar input{font-family:inherit;font-size:.55rem;background:var(--panel);
  border:2px solid var(--line);color:var(--text);padding:12px;width:220px;text-transform:uppercase}
#endBar input:focus{outline:none;border-color:var(--violet)}
#endBar button{font-family:inherit;font-size:.55rem;background:var(--panel);
  border:2px solid var(--violet);color:var(--text);padding:12px 16px;cursor:pointer}
#endBar button.secondary{border-color:var(--line)}
#endBar button:disabled{opacity:.4}
#endStatus{width:100%;text-align:center;font-size:.5rem;color:var(--dim);min-height:1.2em}

/* touch: canvas preenche a tela de verdade (encaixado pela proporção, sem
   fórmula de largura fixa), controles flutuam nos cantos como na maioria dos
   jogos de celular, e as caixas de fim de jogo/criação viram um painel
   flutuante sempre alcançável — nunca empurrado pra fora da tela visível. */
@media (pointer:coarse){
  #wrap{padding:0;gap:0}
  #topbar{position:fixed;top:0;left:0;right:0;z-index:5;width:100%;
    padding:6px calc(8px + env(safe-area-inset-right)) 4px calc(8px + env(safe-area-inset-left));
    background:linear-gradient(rgba(11,10,20,.8),transparent)}
  #gameCanvas{max-width:100vw;max-height:100vh;width:auto;height:auto;margin:auto}
  @supports (height:100svh){ #gameCanvas{max-height:100svh} }
  #touchBar{position:fixed;inset:0;display:flex;pointer-events:none;gap:0;width:100%;max-width:none;padding:0}
  #touchBar button{position:absolute;pointer-events:auto;flex:none;
    width:56px;height:56px;border-radius:50%;padding:0;font-size:.34rem;line-height:1.15}
  #touchBar #btnDuck{left:calc(18px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom))}
  #touchBar #btnSkill{right:calc(34px + env(safe-area-inset-right));bottom:calc(2px + env(safe-area-inset-bottom));
    width:42px;height:42px;font-size:.28rem}
  #touchBar #btnJump{right:calc(18px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));
    width:72px;height:72px;font-size:.4rem}
  #endBar{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));
    transform:translateX(-50%);width:calc(100vw - 20px);max-width:420px;max-height:min(70vh,70svh);
    overflow-y:auto;z-index:10}
}
</style>
</head>
<body>
<div id="rotatePrompt">
  <div class="icon">📱</div>
  <p>Gire seu celular pra jogar</p>
  <p class="sub">She Runs é em modo paisagem — deitado fica bem maior</p>
</div>
<div id="wrap">
  <div id="topbar">
    <span class="logo">SHE RUNS</span>
    <div style="display:flex;gap:8px">
      <a href="javascript:void(0)" id="lbTopLink">🏆 RANKING</a>
      <a href="index.html">← TIMELINE</a>
    </div>
  </div>
  <canvas id="gameCanvas" class="rainbowFrameThin" width="1080" height="608"></canvas>
  <button id="lbEntryBtn">🏆 VER RANKING</button>
  <button id="backBtn">← VOLTAR</button>
  <div id="charNavBar">
    <button id="btnCharPrev" aria-label="Personagem anterior">◀</button>
    <button id="btnCharNext" aria-label="Próxima personagem">▶</button>
  </div>
  <div id="touchBar">
    <button id="btnDuck">↓ ABAIXAR</button>
    <button id="btnJump">↑ PULAR</button>
    <button id="btnSkill">ESPECIAL</button>
  </div>
  <div id="endBar">
    <input id="pName" maxlength="3" placeholder="AAA" style="width:70px;text-align:center;letter-spacing:.3em">
    <button id="saveBtn">SALVAR SCORE</button>
    <button id="lbBtn" class="secondary">VER RANKING</button>
    <div id="endStatus"></div>
  </div>
</div>

<script>
'use strict';
const cv = document.getElementById('gameCanvas');
const cx = cv.getContext('2d');
/* coordenadas lógicas 720x405, escaladas para bater com a resolução real exibida → nitidez em qualquer tamanho */
const W = 720, H = 405;
function fitCanvas(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const rectW = cv.getBoundingClientRect().width || 1080;
  const bw = Math.max(1, Math.round(rectW*dpr));
  const bh = Math.round(bw*(H/W));
  if(cv.width===bw && cv.height===bh) return;
  cv.width=bw; cv.height=bh;
  cx.setTransform(bw/W,0,0,bw/W,0,0);
  cx.imageSmoothingEnabled = false;
}
fitCanvas();
addEventListener('resize', fitCanvas);

/* ══════════ LEADERBOARD ══════════ */
const WORKER_URL = 'https://she-runs-worker.pantocbt.workers.dev';
const SALT = '63780e9dec4d0d50ba67bce550b48464cf70deafa9f688263905beb4335badf5';

/* ══════════ GAME FEEL ══════════ */
const GRAVITY=0.7, JUMP_FORCE=-12, MAX_FALL=15, COYOTE=6, BUFFER=10;
const GROUND_Y = H-72;
const CHARGE_MAX = 5;          // desvios necessários para carregar o especial

/* ══════════ PALETA (mesma da timeline) ══════════ */
const C = {
  bg:'#0b0a14', panel:'#151327', line:'#2e2a4d',
  text:'#e8e6f5', dim:'#9490b8',
  good:'#5ddc9c', gold:'#f7c343', bad:'#ff5d6c',
  cyan:'#4cc9f0', violet:'#c77dff', warn:'#ffb347',
};
const SKIN = { l:'#f2c9a8', m:'#c98b5e', d:'#8a5533', dd:'#5f381f' };
const HAIR = { blk:'#241c30', brn:'#5d3a24', gry:'#b9b4c9', wht:'#e4e0ee' };

/* ══════════ ÁUDIO ══════════ */
let AC=null;
function audio(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function beep(freq,dur,type='square',vol=.12,slide=0){
  try{
    const a=audio(), o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.value=freq;
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),a.currentTime+dur/1000);
    g.gain.value=vol; g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur/1000);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime+dur/1000);
  }catch(e){}
}
const SFX={
  jump:()=>beep(440,80,'square',.1,440),
  collect:()=>{beep(880,50,'sine',.12);setTimeout(()=>beep(1320,60,'sine',.1),50)},
  hit:()=>beep(300,150,'sawtooth',.14,-220),
  charged:()=>{beep(660,60,'sine',.1);setTimeout(()=>beep(990,90,'sine',.12),70)},
  skill:()=>{beep(523,90,'sine',.11);setTimeout(()=>beep(659,90,'sine',.11),70);setTimeout(()=>beep(784,140,'sine',.11),140)},
  boss:()=>{beep(60,500,'sine',.2);beep(1200,320,'square',.06)},
  select:()=>beep(660,45,'square',.08),
  perfect:()=>{beep(880,30,'sine',.1);setTimeout(()=>beep(880,30,'sine',.1),60);setTimeout(()=>beep(1760,60,'sine',.12),120)},
  win:()=>{[262,330,392,523].forEach((f,i)=>setTimeout(()=>beep(f,90,'square',.11),i*90))},
  lose:()=>beep(220,900,'sawtooth',.08,-160),
};

/* ══════════ SPRITES ══════════ */
function drawGrid(grid, pal, x, y, s){
  for(let r=0;r<grid.length;r++)
    for(let c=0;c<grid[r].length;c++){
      const k=grid[r][c];
      if(k==='.') continue;
      cx.fillStyle=pal[k];
      cx.fillRect(x+c*s, y+r*s, s, s);
    }
}

/* ── CORPO PADRÃO das personagens: 12 colunas × 18 linhas ──
   cabeça 8 · tronco 7 · pernas 3 — a mesma proporção para todas  */
const HEADS = {
  /* Ada: coque + faixa/tiara (G) no meio do cabelo + bochecha (K) ao lado da boca, não embaixo */
  updo:[ "....HH......","...HHHHHH...",".GGGGGGGGGG.",".HHHHHHHHHH.",".HHSSSSSSHH.",".HHSEESEESH.",".HHSKMMMKSH.","..HSSSSSSH.." ],
  short:["............","...HHHHHH...","..HHHHHHHH..","..HSSSSSSH..","..HSEESEESH.","..HSSSSSSSH.","..HSKMMMKSH.","...SSSSSSS.." ],
  long: ["...HHHHHH...","..HHHHHHHH..",".HHHHHHHHHH.",".HHSSSSSSHH.",".HHSEESEESH.",".HHSSSSSSSH.",".HHSKMMMKSH.",".HHSSSSSSH.." ],
  bun:  [".....HH.....","....HHHH....","..HHHHHHHH..",".HHHHHHHHHH.",".HHSSSSSSHH.","..HSEESEESH.","..HSKMMMKSH.","...SSSSSSS.." ],
  /* Grace: boné de fita naval — topo C, aba D, cabelo curto aparecendo embaixo + bochecha */
  cap:  [ "..CCCCCCCC..",".CCCCCCCCCC.",".DDDDDDDDDD.","..HSSSSSSH..","..HSEESEESH.","..HSSSSSSSH.","..HSKMMMKSH.","...SSSSSSS.." ],
  /* Katherine: black-power afro volumoso + óculos de aro claro (G, acento) + bochecha — contraste alto contra pele/cabelo escuros */
  afro: [ "..HHHHHHHH..",".HHHHHHHHHH.","HHHHHHHHHHHH","HHHSSSSSSHHH","HHHGEESEEGHH","HHHSSSSSSHHH",".HHSKMMMKSH.","..HSSSSSSH.." ],
};
/* tronco com ombros, braços (S = pele) e detalhe da roupa (G) */
const TORSOS = {
  dress:  ["...CCCCCC...","..CCCCCCCC..",".SCCCCCCCCS.",".SCCCGGCCCS.","..CCCCCCCC..",".CCCCCCCCCC.","CCCCCCCCCCCC"],
  uniform:["..CCCCCCCC..",".CCCCCCCCCC.",".SCCGCCGCCS.",".SCCCCCCCCS.","..CCCCCCCC..","..CCCCCCCC..","..DDDDDDDD.."],
  coat:   ["...CCCCCC...","..CCCCCCCC..",".SCCGGGGCCS.",".SCCGGGGCCS.","..CCGGGGCC..","..CCGGGGCC..","..DDDDDDDD.."],
  blouse: ["...CCCCCC...","..CCCCCCCC..",".SCCCCCCCCS.",".SCCCCCCCCS.","..CCCCCCCC..","..CCCCCCCC..","..DDDDDDDD.."],
};
const LEGS_RUN = [
  ["...PP..PP...","...PP..PP...","...BB..BB..."],
  ["..PP....PP..","..PP....PP..","..BB....BB.."],
  ["....PPPP....","...PP..PP...","...BB.BB...."],
];
const LEGS_AIR = ["...PPPP.....","..PP...PP...","..BB....BB.."];
/* agachar = pernas curtas e dobradas + tronco cortado — sem esticar nenhum pixel */
const LEGS_DUCK = ["..PP....PP..","..BBBB..BBBB"];
const HERO_S=2.6, HERO_W=12*HERO_S, HERO_H=18*HERO_S;
const HERO_H_DUCK=(8+4+2)*HERO_S;   // cabeça 8 + metade do tronco 4 + pernas curtas 2

/* mesma mistura de cor usada na timeline (index.html), pra bochecha ficar
   consistente com qualquer tom de pele em vez de um rosa fixo */
function mixHex(a, b, amt){
  const A = parseInt(a.slice(1),16), B = parseInt(b.slice(1),16);
  const ch = s => [ (A>>s)&255, (B>>s)&255 ];
  const m = s => { const [x,y]=ch(s); return Math.round(x + (y-x)*amt); };
  return '#' + ((1<<24) | (m(16)<<16) | (m(8)<<8) | m(0)).toString(16).slice(1);
}
function heroPal(ch){
  /* estilo minimalista: sem boca visível (M vira pele), só bochecha — igual à timeline */
  const skin = SKIN[ch.skin];
  return { H:HAIR[ch.hair], S:skin, E:'#1a1526', M:skin, K:mixHex(skin,'#ff6f91',.34),
           C:ch.color1, D:ch.color2, G:ch.accent, P:ch.color2, B:'#161225' };
}

/* personagem inteira montada por grade de texto — mesmo estilo da timeline */
function drawHero(ch,x,y,duck,legFrame,onGround){
  cx.save();
  if(flashRed>0) cx.globalAlpha=.55;
  if(duck){
    const grid = [...HEADS[ch.head], ...TORSOS[ch.torso].slice(0,4), ...LEGS_DUCK];
    drawGrid(grid, heroPal(ch), x-HERO_W/2, y-HERO_H_DUCK, HERO_S);
  } else {
    const legs = onGround===false ? LEGS_AIR : LEGS_RUN[legFrame%3];
    const grid = [...HEADS[ch.head], ...TORSOS[ch.torso], ...legs];
    drawGrid(grid, heroPal(ch), x-HERO_W/2, y-HERO_H, HERO_S);
  }
  cx.restore();
}

/* ── CHEFES: 16 col × 22 linhas — cabeça 7 · tronco 8 · pernas 4 · pés 3 ── */
const BOSS_LEGS  = ["...PPP..PPP...","...PPP..PPP...","...PPP..PPP...","..BBBB..BBBB.."];
function bossGrid(head, torso){ return [...head, ...torso, ...BOSS_LEGS]; }

const LORD_HEAD=[  "..TTTTTTTTTT..","..TTTTTTTTTT..","TTTTTTTTTTTTTT","...KKKKKKKK...","...KRRKKRRK...","...KKKKKKKK...","....KKKKKK...."];
const LORD_TORSO=[ "..CCCCWWCCCC..",".CCCCCWWCCCCC.",".CCCCWWWWCCCC.","CCCCCWWWWCCCCC","CCCCCWWWWCCCCC",".CCCC.WW.CCCC.",".CCCC....CCCC.","..CCC....CCC.."];
const LORD_PAL={T:'#2b1d10',K:'#3a2c20',R:'#ff5d6c',C:'#5a3620',W:'#e8dcc8',P:'#2b1d10',B:'#100c08'};

const COMM_HEAD=[  "...GGGGGGGG...","..GGGGGGGGGG..","..GSSSSSSSSG..","..GSRRSSRRSG..","..GSSSSSSSSG..","...SSSSSSSS...","....SSSSSS...."];
const COMM_TORSO=[ "..NNNNNNNNNN..",".NNNNNNNNNNNN.",".NNNNWWWWNNNN.","NNNNNWWWWNNNNN","NNNNNWWWWNNNNN",".NNNN.WW.NNNN.",".NNNN....NNNN.","..NNN....NNN.."];

const PALE_PAPER={ ada:'#e4d9f5', grace:'#d6e0f2', katherine:'#f5ecc9', hamilton:'#f5ddc9' };
function tintedPal(shape, ch){
  const pale = PALE_PAPER[ch.id] || '#d9c9a8';
  switch(shape){
    case 'RH':      return { w:pale, r:ch.color2, R:'#ff5d6c' };
    case 'CLOCK':   return { c:ch.color1, d:'#0b0a14' };
    case 'BALLOON': return { b:ch.color1, w:pale };
    case 'MAIL':    return { m:ch.color2 };
    case 'LADDER':  return { r:ch.color2, R:ch.accent, X:'#ff5d6c' };
    case 'DOOR':    return { d:ch.color2, e:ch.color1, K:ch.accent };
    default: return null;
  }
}
function getSprite(hero, shape){
  const sig = SIGNATURE_SPRITES[hero.id];
  if(sig && sig[shape]) return sig[shape];
  if(SHARED_GRIDS[shape]) return [ SHARED_GRIDS[shape], tintedPal(shape, hero) ];
  return SPRITES[shape];
}

const stars=[];
(function(){
  const layers=[
    {n:70, sz:1, sp:.10, col:['#ffffff']},
    {n:50, sz:1, sp:.22, col:['#ffffff','#c77dff','#4cc9f0']},
    {n:36, sz:2, sp:.40, col:['#ffffff','#f7c343','#ff7b9c','#5ddc9c']},
    {n:20, sz:2, sp:.68, col:['#c77dff','#4cc9f0','#f7c343']},
    {n:10, sz:3, sp:1.0, col:['#ffffff','#f7c343']},
  ];
  layers.forEach(L=>{
    for(let i=0;i<L.n;i++) stars.push({
      x:Math.random()*W, y:Math.random()*(GROUND_Y-20),
      sz:L.sz, sp:L.sp, c:L.col[(Math.random()*L.col.length)|0],
      ph:Math.random()*6.28, tw:.5+Math.random()*1.5
    });
  });
})();
let shootTimer=400+Math.random()*400, shoot=null;

function drawBackground(scrollSpeed, t){
  const g=cx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0b0a14'); g.addColorStop(.6,'#12102a'); g.addColorStop(1,'#0b0a14');
  cx.fillStyle=g; cx.fillRect(0,0,W,H);
  const nb=[[.2,.3,'#c77dff',.05],[.75,.5,'#4cc9f0',.05],[.5,.15,'#ff7b9c',.03]];
  nb.forEach(([nx,ny,col,al])=>{
    const gr=cx.createRadialGradient(nx*W,ny*H,0,nx*W,ny*H,W*.35);
    gr.addColorStop(0,col+Math.round(al*255).toString(16).padStart(2,'0'));
    gr.addColorStop(1,col+'00');
    cx.fillStyle=gr; cx.fillRect(0,0,W,H);
  });
  stars.forEach(s=>{
    s.x -= scrollSpeed*s.sp*.35;
    if(s.x<-3){ s.x=W+3; s.y=Math.random()*(GROUND_Y-20); }
    const a=.35+Math.sin(t*.02*s.tw+s.ph)*.45;
    if(a<=0) return;
    cx.globalAlpha=a; cx.fillStyle=s.c;
    cx.fillRect(s.x|0, s.y|0, s.sz, s.sz);
  });
  cx.globalAlpha=1;
  shootTimer--;
  if(shootTimer<=0 && !shoot){ shoot={x:Math.random()*W*.7+W*.2, y:30+Math.random()*100, life:18}; shootTimer=500+Math.random()*600; }
  if(shoot){
    cx.strokeStyle='#ffffff'; cx.globalAlpha=shoot.life/18;
    cx.beginPath(); cx.moveTo(shoot.x,shoot.y); cx.lineTo(shoot.x+16,shoot.y+5); cx.stroke();
    cx.globalAlpha=1;
    shoot.x-=7; shoot.y-=2.2; shoot.life--;
    if(shoot.life<=0) shoot=null;
  }
  cx.fillStyle='#171430'; cx.fillRect(0,GROUND_Y,W,H-GROUND_Y);
  cx.strokeStyle=C.violet; cx.globalAlpha=.5; cx.lineWidth=2;
  cx.beginPath(); cx.moveTo(0,GROUND_Y); cx.lineTo(W,GROUND_Y); cx.stroke();
  cx.globalAlpha=.14; cx.lineWidth=1;
  const off=(t*scrollSpeed)%36;
  for(let x=-off;x<W;x+=36){ cx.beginPath(); cx.moveTo(x,GROUND_Y); cx.lineTo(x-30,H); cx.stroke(); }
  for(let y=GROUND_Y+10;y<H;y+=12){ cx.beginPath(); cx.moveTo(0,y); cx.lineTo(W,y); cx.stroke(); }
  cx.globalAlpha=1;
}

const RUN_CFG={speedBase:2.3, speedMax:3.5, gapBase:[130,185], gapTight:[72,108], progRate:0.0125};

function spawnObstacle(prog01){
  prog01=prog01||0;
  const pool=hero.obstacles;
  const weights=pool.map(o=>o.need==='collect'?0.9:1.5+prog01*0.8);
  const total=weights.reduce((a,b)=>a+b,0);
  let roll=Math.random()*total, def=pool[0];
  for(let i=0;i<pool.length;i++){ roll-=weights[i]; if(roll<=0){ def=pool[i]; break; } }
  let y;
  if(def.shape==='GATE') y=GROUND_Y-def.h;
  else if(def.need==='duck') y=GROUND_Y-60;
  else if(def.need==='collect') y=GROUND_Y-70-Math.random()*60;
  else y=GROUND_Y-def.h;
  obstacles.push({def, x:W+40, y, w:def.w, h:def.h, bobPh:Math.random()*6.28});

  // combo: a partir da metade da corrida, às vezes um segundo obstáculo mortal vem logo atrás
  const comboChance=Math.max(0,(prog01-0.45)*0.55);
  if(def.deadly && Math.random()<comboChance){
    const deadlyPool=pool.filter(o=>o.deadly);
    let def2=deadlyPool[Math.floor(Math.random()*deadlyPool.length)], tries=0;
    while(def2===def && tries<5){ def2=deadlyPool[Math.floor(Math.random()*deadlyPool.length)]; tries++; }
    const y2=def2.need==='duck'?GROUND_Y-60:GROUND_Y-def2.h;
    const gap2=100+Math.random()*40;
    obstacles.push({def:def2, x:W+40+gap2, y:y2, w:def2.w, h:def2.h, bobPh:Math.random()*6.28});
  }
}

    player.vy=JUMP_FORCE; player.jumps=2; SFX.jump(); burst(player.x, player.y, '#ffffff', 6);
  }
}
/* WASD com a mesma função das setas em todo o jogo — normaliza aqui uma
   única vez em vez de checar os dois códigos em cada lugar */
const WASD_TO_ARROW = { KeyW:'ArrowUp', KeyA:'ArrowLeft', KeyS:'ArrowDown', KeyD:'ArrowRight' };
const LEFT=e=>e.code==='ArrowLeft'||e.code==='KeyA', RIGHT=e=>e.code==='ArrowRight'||e.code==='KeyD',
      UP=e=>e.code==='ArrowUp'||e.code==='KeyW', DOWN=e=>e.code==='ArrowDown'||e.code==='KeyS';
addEventListener('keydown',e=>{
  if(e.repeat) return;
  if(document.activeElement && document.activeElement.tagName==='INPUT') return;
  keys[e.code]=true;
  if(WASD_TO_ARROW[e.code]) keys[WASD_TO_ARROW[e.code]]=true;   // RUN e o desvio do chefe leem keys['Arrow...'] direto
  if(state==='SELECT'){
    const tot=CHARS.length;
    if(LEFT(e)){ selIdx=(selIdx+tot-1)%tot; SFX.select(); }
    if(RIGHT(e)){ selIdx=(selIdx+1)%tot; SFX.select(); }
    if(e.code==='Space'||e.code==='Enter') startRun();
    if(e.code==='KeyL') openLeaderboard();
    return;
  }
  if(state==='VICTORY'||state==='GAMEOVER'){
    if(e.code==='Space'||e.code==='Enter'){ state='SELECT'; hideEndBar(); }
    if(e.code==='KeyL') openLeaderboard();
    return;
  }
  if(state==='LEADERBOARD'){
    if(e.code==='Space'||e.code==='Enter'||e.code==='Escape') state=lbFrom;
    return;
  }
  if(state==='RUN'){
    if(e.code==='Space'||UP(e)) tryJump();
    if(DOWN(e)) player.duck=true;
    if(e.code==='KeyZ'||e.code==='KeyF') useSkill();
  }
  if(state==='BOSSINTRO'||state==='BOSSTEXT'||state==='BOSSWIN'){
    if(e.code==='Space'||e.code==='Enter') advanceBossText();
  }
  if(state==='BOSSMENU'){
    if(UP(e)){ bossSel=(bossSel+3)%4; SFX.select(); }
    if(DOWN(e)){ bossSel=(bossSel+1)%4; SFX.select(); }
    if(e.code==='Space'||e.code==='Enter') chooseBossAction();
  }
});
addEventListener('keyup',e=>{
  keys[e.code]=false;
  if(WASD_TO_ARROW[e.code]) keys[WASD_TO_ARROW[e.code]]=false;
  if(DOWN(e)) player.duck=false;
});

const btn=(id,down,up)=>{
  const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();down();},{passive:false});
  if(up) el.addEventListener('touchend',e=>{e.preventDefault();up();},{passive:false});
};
function primaryAction(){
  if(state==='SELECT') startRun();
  else if(state==='VICTORY'||state==='GAMEOVER'){ state='SELECT'; hideEndBar(); }
  else if(state==='RUN') tryJump();
  else if(state==='BOSSINTRO'||state==='BOSSTEXT'||state==='BOSSWIN') advanceBossText();
  else if(state==='BOSSMENU') chooseBossAction();
  else if(state==='LEADERBOARD') state=lbFrom;
}
btn('btnJump', ()=>{ keys['Space']=true; primaryAction(); }, ()=>{ keys['Space']=false; });
btn('btnDuck',()=>{
  if(state==='RUN') player.duck=true;
  else if(state==='SELECT'){ const tot=CHARS.length; selIdx=(selIdx+1)%tot; SFX.select(); }
  else if(state==='BOSSMENU'){ bossSel=(bossSel+1)%4; SFX.select(); }
},()=>{ player.duck=false; });
btn('btnSkill',()=>{
  if(state==='RUN') useSkill();
});

/* toque no jogo: arrastar move a personagem (corrida) ou o cursor (desvio do chefe) */
let touchDrag=null;
/* toque na tela do jogo em si: só o desvio do chefe usa arrastar (precisão fina).
   Durante a corrida o toque na tela NÃO faz mais nada — pular/abaixar/mover são
   só pelos botões dedicados, pra evitar pulo/movimento sem querer. */
cv.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(state==='BOSSDODGE'){
    const r=cv.getBoundingClientRect();
    touchDrag={x:e.touches[0].clientX-r.left, y:e.touches[0].clientY-r.top};
    return;
  }
  if(state==='RUN') return;   // corrida: toque na tela não faz nada, só os botões
  primaryAction();
},{passive:false});
cv.addEventListener('touchmove',e=>{
  if(!touchDrag || state!=='BOSSDODGE') return;
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  const nx=e.touches[0].clientX-r.left, ny=e.touches[0].clientY-r.top;
  arena.px+=(nx-touchDrag.x)*(W/r.width); arena.py+=(ny-touchDrag.y)*(H/r.height);
  touchDrag={x:nx,y:ny};
},{passive:false});
cv.addEventListener('touchend',e=>{
  touchDrag=null;
},{passive:false});

/* ══════════ ESPECIAL ══════════ */
function addCharge(n){
  const before=player.charge;
  player.charge=Math.min(CHARGE_MAX, player.charge+n);
  if(before<CHARGE_MAX && player.charge>=CHARGE_MAX){
    SFX.charged();
    floatTexts.push({x:player.x-30,y:player.y-90,txt:'ESPECIAL PRONTO! [Z]',c:hero.theme,life:80});
  }
}
function useSkill(){
  if(player.charge<CHARGE_MAX) return;
  player.charge=0;
  player.skillActiveTimer=90;     // ~1.5s: abre portões que dependem do especial
  SFX.skill();
  const ty=player.y-90;
  floatTexts.push({x:player.x-20,y:ty,txt:hero.skill.name+'!',c:hero.theme,life:70});
  const type=hero.skill.type;
  if(type==='freeze'){ player.freeze=180; }
  else if(type==='shield'){ player.shield=true; }
  else if(type==='orbit'){ player.orbit=240; }
  else if(type==='debug'){
    let best=null,bd=1e9;
    obstacles.forEach(o=>{ if(!o.def.deadly) return; const d=o.x-player.x; if(d>-20&&d<bd){bd=d;best=o;} });
    if(best){
      score+=60; stats.especial+=60;
      floatTexts.push({x:best.x,y:best.y,txt:'+60',c:C.cyan,life:55});
      burst(best.x+best.w/2,best.y+best.h/2,C.cyan,10);
      particles.push({x:best.x,y:best.y,vx:2,vy:-2.5,c:'#d9c9a8',sz:4,life:40,moth:true});
      obstacles.splice(obstacles.indexOf(best),1);
    }
  }
  pressure=Math.max(0,pressure-12);
}

function burst(x,y,c,n){
  for(let i=0;i<n;i++) particles.push({ x,y, vx:(Math.random()-.5)*5, vy:(Math.random()-.5)*5-1, c, sz:2+Math.random()*2, life:20+Math.random()*15 });
}
function hitPlayer(){
  if(player.orbit>0 || player.freeze>0) return;
  if(player.shield){ player.shield=false; SFX.charged(); floatTexts.push({x:player.x-20,y:player.y-70,txt:'ESCUDO!',c:C.good,life:50}); return; }
  SFX.hit();
  player.hp-=18; pressure=Math.min(100,pressure+15);
  combo=0; comboMult=1; shake=5; flashRed=4;
  if(player.hp<=0||pressure>=100) gameOver();
}
function gameOver(){ state='GAMEOVER'; SFX.lose(); showEndBar(); }

function startRun(){
  hero=CHARS[selIdx];
  score=0; pressure=0; combo=0; comboMult=1; resetStats();
  progress=0; obstacles=[]; particles=[]; floatTexts=[];
  player.x=120; player.y=GROUND_Y; player.vy=0; player.ground=true; player.duck=false; player.jumps=0;
  player.hp=100; player.charge=0; player.freeze=0; player.shield=false; player.orbit=0;
  spawnTimer=100; state='RUN';
  hideEndBar(); audio();
}

function updateRun(){
  const prog01=Math.min(1,progress/100);
  const curSpeed=RUN_CFG.speedBase+(RUN_CFG.speedMax-RUN_CFG.speedBase)*prog01;
  progress+=RUN_CFG.progRate*curSpeed;
  if(progress>=100){ enterBoss(); return; }
  if(player.freeze>0) player.freeze--;
  if(player.orbit>0) player.orbit--;
  if(player.skillActiveTimer>0) player.skillActiveTimer--;

  spawnTimer--;
  if(spawnTimer<=0){
    spawnObstacle(prog01);
    const gLo=RUN_CFG.gapBase[0]-(RUN_CFG.gapBase[0]-RUN_CFG.gapTight[0])*prog01;
    const gHi=RUN_CFG.gapBase[1]-(RUN_CFG.gapBase[1]-RUN_CFG.gapTight[1])*prog01;
    spawnTimer=gLo+Math.random()*(gHi-gLo);
  }

  const mv=2.6;
  if(keys['ArrowLeft']||keys['KeyA'])  player.x=Math.max(50, player.x-mv);
  if(keys['ArrowRight']||keys['KeyD']) player.x=Math.min(W*.62, player.x+mv);

  if(player.ground) player.coyote=COYOTE; else player.coyote--;
  if(player.buffer>0){
    player.buffer--;
    if(player.coyote>0){
      player.vy=JUMP_FORCE; player.ground=false; player.coyote=0; player.buffer=0; player.jumps=1;
      SFX.jump(); burst(player.x, player.y, '#ffffff', 3);
    }
  }
  if(!player.ground){
    player.vy=Math.min(MAX_FALL, player.vy+GRAVITY);
    if(player.vy<0 && !(keys['Space']||keys['ArrowUp'])) player.vy+=GRAVITY*.8;
    player.y+=player.vy;
    if(player.y>=GROUND_Y){ player.y=GROUND_Y; player.vy=0; player.ground=true; player.jumps=0; }
  }
  player.legFrame=(t/7|0)%3;

  if(t%360===0) pressure=Math.min(100,pressure+1);
  if(pressure>=100){ gameOver(); return; }

  const ph=player.duck?HERO_H_DUCK:HERO_H;
  const py=player.y-ph, pw=player.w*.6, px=player.x-pw/2;
  const spd = curSpeed;

  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i], def=o.def;
    o.x-=spd;
    if(def.need==='collect') o.y+=Math.sin(t*.08+o.bobPh)*.5;
    const ow=o.w*.7, oh=o.h*.7;
    const ox=o.x+(o.w-ow)/2, oy=o.y+(o.h-oh)/2;
    const hit = px<ox+ow && px+pw>ox && py<oy+oh && py+ph>oy;
    if(hit){
      if(def.need==='skill'){
        if(player.skillActiveTimer>0){
          o.scored=true; score+=def.pts; stats.especial+=def.pts; addCharge(1);
          burst(o.x+o.w/2,GROUND_Y-40,hero.theme,10);
          floatTexts.push({x:o.x,y:GROUND_Y-60,txt:'ABERTO!',c:hero.theme,life:50});
          obstacles.splice(i,1); continue;
        }
        hitPlayer(); obstacles.splice(i,1); continue;
      }
      if(def.deadly){
        if(player.orbit>0 || player.freeze>0){     // trajetória perfeita OU algoritmo: atravessa
          o.scored=true; score+=def.pts; stats.especial+=def.pts; addCharge(1);
          burst(o.x+o.w/2,o.y+o.h/2,hero.theme,8);
          obstacles.splice(i,1); continue;
        }
        hitPlayer(); obstacles.splice(i,1); continue;
      } else {
        SFX.collect(); score+=def.pts*comboMult; stats.coleta+=def.pts*comboMult; addCharge(1);
        floatTexts.push({x:o.x,y:o.y,txt:'+'+(def.pts*comboMult),c:C.gold,life:50});
        burst(o.x+o.w/2,o.y+o.h/2,C.gold,8);
        obstacles.splice(i,1); continue;
      }
    }
    if(o.x+o.w<player.x-30 && !o.scored && def.deadly){
      o.scored=true; combo++; score+=def.pts*comboMult; stats.desvio+=def.pts*comboMult;
      addCharge(1);
      if(combo>0&&combo%5===0){
        comboMult=Math.min(4,comboMult+1);
        pressure=Math.max(0,pressure-20);
        floatTexts.push({x:player.x,y:player.y-70,txt:'COMBO x'+comboMult,c:C.good,life:60});
      }
    }
    if(o.x<-70) obstacles.splice(i,1);
  }
}

/* ══════════ CHEFE ══════════ */
const BOSS_ACTIONS=[
  {label:'RESPONDER',      desc:'ataque direto',                          dmg:[18,26], type:'atk'},
  {label:'NEGOCIAR',       desc:'dano menor, mas ele erra o próx. golpe', dmg:[12,18], type:'calm'},
  {label:'★ ESPECIAL',     desc:'dano alto — precisa da barra cheia',     dmg:[34,44], type:'skill'},
  {label:'RESPIRAR FUNDO', desc:'-15 pressão + amortece o golpe dele',    dmg:[0,0],  type:'def'},
];
let boss=null, bossSel=0, bossMsg='', bossMsgTimer=0, bossRound=1;
let arena={px:0,py:0,projs:[],timer:0,hitTaken:0};

function enterBoss(){
  const B=hero.boss;
  boss={ ...B, maxHp:B.hp, hp:B.hp, turn:0 };
  bossRound=1; state='BOSSINTRO'; SFX.boss(); obstacles=[]; shake=8;
}
function advanceBossText(){
  if(state==='BOSSINTRO'){ state='BOSSMENU'; bossSel=0; }
  else if(state==='BOSSTEXT'){ if(bossMsgTimer>40) startDodge(); }
  else if(state==='BOSSWIN'){ state='VICTORY'; showEndBar(); }
}
function chooseBossAction(){
  const a=BOSS_ACTIONS[bossSel];
  if(a.type==='skill'&&player.charge<CHARGE_MAX){ SFX.hit(); return; }
  SFX.select();
  let dmg=0;
  if(a.type==='atk') dmg=a.dmg[0]+Math.random()*(a.dmg[1]-a.dmg[0])|0;
  if(a.type==='calm'){ dmg=a.dmg[0]+Math.random()*(a.dmg[1]-a.dmg[0])|0; player.calmNext=true; }
  if(a.type==='skill'){ dmg=a.dmg[0]+Math.random()*(a.dmg[1]-a.dmg[0])|0; player.charge=0; SFX.skill();
    floatTexts.push({x:W/2-60,y:150,txt:hero.skill.name+'!',c:hero.theme,life:70}); }
  if(a.type==='def'){ pressure=Math.max(0,pressure-15); player.defNext=true; }
  if(dmg>0){
    dmg=Math.round(dmg*comboMult*.5+dmg*.5);
    boss.hp=Math.max(0,boss.hp-dmg);
    floatTexts.push({x:W-170,y:120,txt:'-'+dmg,c:C.gold,life:55});
    burst(W-150,150,C.gold,8);
  }
  if(boss.hp<=0){ score+=300; stats.chefe+=300; SFX.win(); state='BOSSWIN'; return; }
  bossMsg=a.type==='def'?'Você respira. A pressão baixa.':'Você responde com firmeza.';
  state='BOSSTEXT'; bossMsgTimer=0;
}
function startDodge(){
  const Q=boss.qs[boss.turn % boss.qs.length];
  const up=1+boss.turn*0.12;
  let dmg=Q.dmg;
  if(player.calmNext){ dmg=Math.round(dmg*.55); player.calmNext=false; }
  arena={px:W/2+80, py:H/2, projs:[], timer:0, hitTaken:0, name:Q.q, dmg, dur:Q.pat==='spread'?250:200};
  const y0=H/2-38;
  if(Q.pat==='line'){ for(let i=0;i<3;i++) arena.projs.push({x:W/2-160-i*70, y:y0+[15,45,75][i], vx:2.3*up, vy:0, sz:9}); }
  else if(Q.pat==='wave'){ for(let i=0;i<4;i++) arena.projs.push({x:W/2-160-i*60, y:y0+40, vx:2.4*up, vy:0, sz:9, wave:true, ph:i*1.2}); }
  else if(Q.pat==='rain'){ for(let i=0;i<5;i++) arena.projs.push({x:W/2-150+i*70, y:H/2-140-Math.random()*40, vx:0, vy:1.5*up+Math.random()*.5, sz:9}); }
  else { for(let i=0;i<5;i++) arena.projs.push({x:W/2-170, y:y0+40, vx:(2.0+i*.18)*up, vy:(i-2)*.55, sz:9}); }
  boss.turn++; state='BOSSDODGE';
}
function updateDodge(){
  arena.timer++;
  const AX=W/2-190, AY=H/2-58, AW=380, AH=116, sp=3.4;
  if(keys['ArrowLeft'])  arena.px-=sp;
  if(keys['ArrowRight']) arena.px+=sp;
  if(keys['ArrowUp'])    arena.py-=sp;
  if(keys['ArrowDown'])  arena.py+=sp;
  arena.px=Math.max(AX+10,Math.min(AX+AW-10,arena.px));
  arena.py=Math.max(AY+10,Math.min(AY+AH-10,arena.py));
  arena.projs.forEach(p=>{
    p.x+=p.vx;
    if(p.wave) p.y = H/2-38+40 + Math.sin(p.x*.045+p.ph)*34; else p.y+=p.vy||0;
    const dx=p.x-arena.px, dy=p.y-arena.py;
    if(!p.hit && dx*dx+dy*dy < 15*15){ p.hit=true; arena.hitTaken++; SFX.hit(); shake=4; flashRed=3; }
  });
  if(arena.timer>=arena.dur){
    let dmg=0;
    if(arena.hitTaken===0){
      score+=50; stats.perfeito+=50; SFX.perfect(); addCharge(3);
      floatTexts.push({x:W/2-90,y:H/2-90,txt:'DESVIO PERFEITO +50',c:C.good,life:65});
    } else if(arena.hitTaken===1){ dmg=Math.round(arena.dmg*.5); addCharge(1); }
    else dmg=arena.dmg;
    if(player.defNext){ dmg=Math.round(dmg*.4); player.defNext=false; }
    if(dmg>0){
      player.hp-=dmg; pressure=Math.min(100,pressure+10);
      floatTexts.push({x:150,y:H/2,txt:'-'+dmg,c:C.bad,life:55});
    }
    if(player.hp<=0||pressure>=100){ gameOver(); return; }
    bossRound++; state='BOSSMENU';
  }
}

/* ══════════ HUD / DESENHO ══════════ */
function drawChargeBar(x,y,wid){
  const ready=player.charge>=CHARGE_MAX;
  cx.font='6px "Press Start 2P"';
  cx.fillStyle=ready?hero.theme:C.dim;
  cx.fillText(ready?('★ '+hero.skill.name+' PRONTO [Z]'):('★ '+hero.skill.name),x,y-5);
  const seg=wid/CHARGE_MAX;
  for(let i=0;i<CHARGE_MAX;i++){
    cx.fillStyle = i<player.charge ? (ready?hero.theme:C.cyan) : C.panel;
    cx.fillRect(x+i*seg+1, y, seg-2, 8);
    cx.strokeStyle=C.line; cx.lineWidth=1;
    cx.strokeRect(x+i*seg+1, y, seg-2, 8);
  }
  if(ready){
    cx.globalAlpha=.4+Math.sin(t*.2)*.4;
    cx.strokeStyle=hero.theme; cx.lineWidth=2;
    cx.strokeRect(x, y-2, wid, 12);
    cx.globalAlpha=1;
  }
}
function drawHUD(){
  cx.font='8px "Press Start 2P"';
  cx.fillStyle=C.panel; cx.fillRect(12,10,150,26);
  cx.strokeStyle=C.line; cx.lineWidth=1; cx.strokeRect(12,10,150,26);

  const bw=200,bx=(W-bw)/2;
  cx.fillStyle=C.panel; cx.fillRect(bx,12,bw,10);

  cx.fillStyle=C.dim; cx.font='6px "Press Start 2P"';

  cx.fillStyle=C.dim; cx.fillText('PRESSÃO',W-172,18);
  cx.fillStyle=C.panel; cx.fillRect(W-172,22,110,10);
  cx.strokeStyle=C.line; cx.strokeRect(W-172,22,110,10);
  const pc = pressure<50?C.good : pressure<80?C.warn : C.bad;

  cx.font='5px "Press Start 2P"'; cx.fillStyle=C.dim;
  cx.fillText('CHEIA = BURNOUT = FIM',W-172,40);
  cx.font='6px "Press Start 2P"'; cx.fillStyle=C.dim; cx.fillText('HP',W-172,54);
  cx.fillStyle=C.panel; cx.fillRect(W-150,46,88,10);
  cx.fillStyle=C.cyan; cx.fillRect(W-149,47,86*Math.max(0,player.hp)/100,8);

  if(player.freeze>0){ cx.fillStyle=hero.theme; cx.font='6px "Press Start 2P"'; cx.fillText('ATRAVESSANDO',12,84); }
}
const HINT_TXT={jump:'PULE', duck:'ABAIXE', skill:'ESPECIAL [Z]', collect:''};
function drawObstacles(){
  obstacles.forEach(o=>{
    const def=o.def;
    const isGate=def.shape==='GATE', isGap=def.shape==='GAP';
    if(o.x<W-30&&o.x>-20){
      cx.font='7px "Press Start 2P"';
      cx.fillStyle=def.deadly?C.bad:C.gold;
      cx.globalAlpha=.9;
      const labelY = isGate ? GROUND_Y-110 : o.y-14;
      const lw=cx.measureText(def.label).width;
      cx.fillText(def.label, Math.max(4,Math.min(o.x+o.w/2-lw/2, W-lw-4)), labelY);
      const hint=HINT_TXT[def.need];
      if(hint && o.x>player.x+60 && o.x<W-60){
        cx.font='6px "Press Start 2P"'; cx.fillStyle=C.warn;
        cx.globalAlpha=.55+Math.sin(t*.25)*.35;
        const hintY = isGate ? GROUND_Y-20 : o.y-3;
        const hw=cx.measureText(hint).width;
        cx.fillText(hint, o.x+o.w/2-hw/2, hintY);
      }
      cx.globalAlpha=1;
    }
    if(isGap){
      cx.fillStyle=C.bg; cx.fillRect(o.x, GROUND_Y, o.w, H-GROUND_Y);
      cx.strokeStyle=C.bad; cx.lineWidth=2;
      cx.beginPath(); cx.moveTo(o.x,GROUND_Y); cx.lineTo(o.x+6,GROUND_Y+8); cx.lineTo(o.x,GROUND_Y+16); cx.stroke();
      cx.beginPath(); cx.moveTo(o.x+o.w,GROUND_Y); cx.lineTo(o.x+o.w-6,GROUND_Y+8); cx.lineTo(o.x+o.w,GROUND_Y+16); cx.stroke();
      return;
    }
    if(isGate){
      const pulse=.5+Math.sin(t*.15)*.5;
      cx.globalAlpha=.22+pulse*.25;
      cx.fillStyle=hero.theme; cx.fillRect(o.x, GROUND_Y-160, o.w, 160);
      cx.globalAlpha=1;
      cx.fillStyle=hero.theme;
      for(let bx=0; bx<o.w; bx+=8) cx.fillRect(o.x+bx, GROUND_Y-160, 4, 160);
      return;
    }
    if(def.deadly){
      cx.fillStyle='rgba(255,93,108,.25)';
      cx.beginPath(); cx.ellipse(o.x+o.w/2, GROUND_Y+4, o.w*.45, 4, 0, 0, 6.28); cx.fill();
    } else {
      cx.fillStyle='rgba(247,195,67,.18)';
      cx.beginPath(); cx.arc(o.x+o.w/2,o.y+o.h/2, o.w*.8+Math.sin(t*.15)*3, 0, 6.28); cx.fill();
    }
    const [grid,pal]=getSprite(hero, def.shape);
    const ghost = player.freeze>0 && def.deadly;   // ALGORITMO: quase transparente e atravessável
    if(ghost) cx.globalAlpha=.2;
    drawGrid(grid,pal,o.x,o.y,o.w/grid[0].length);
    if(ghost) cx.globalAlpha=1;
  });
}
function drawParticlesTexts(){
  particles.forEach((p,i)=>{
    p.x+=p.vx; p.y+=p.vy; p.life--;
    if(p.moth) p.vy+=Math.sin(t*.4)*.15; else p.vy+=.12;
    cx.globalAlpha=Math.max(0,p.life/25);
    cx.fillStyle=p.c; cx.fillRect(p.x,p.y,p.sz,p.sz);
    if(p.life<=0) particles.splice(i,1);
  });
  cx.globalAlpha=1;
  floatTexts.forEach((f,i)=>{
    f.y-=.7; f.life--;
    cx.globalAlpha=Math.max(0,f.life/40);
    cx.font='8px "Press Start 2P"'; cx.fillStyle=f.c;
    cx.fillText(f.txt,f.x,f.y);
    if(f.life<=0) floatTexts.splice(i,1);
  });
  cx.globalAlpha=1;
}

  cx.fillStyle=C.dim; cx.font='6px "Press Start 2P"'; cx.fillText('RODADA '+bossRound,W-330,88);

function textBox(lines, prompt){

function drawBossMenu(){

function drawArena(){
  const AX=W/2-190, AY=H/2-58, AW=380, AH=116;
  cx.fillStyle='rgba(11,10,20,.9)'; cx.fillRect(AX,AY,AW,AH);
  cx.strokeStyle=C.bad; cx.lineWidth=2; cx.strokeRect(AX,AY,AW,AH);
  cx.font='7px "Press Start 2P"'; cx.fillStyle=C.bad;
  const nw=cx.measureText(arena.name).width;
  cx.fillText(arena.name,Math.max(AX,AX+AW/2-nw/2),AY-10);
  cx.font='6px "Press Start 2P"'; cx.fillStyle=C.dim;
  cx.fillText('SETAS PARA DESVIAR',AX+AW-160,AY+AH+22);
  arena.projs.forEach(p=>{
    if(p.hit) return;
    cx.fillStyle=C.bad; cx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);
    cx.fillStyle='#3a1220'; cx.fillRect(p.x-2,p.y-1,4,2);

  cx.fillStyle=C.panel; cx.fillRect(AX,AY+AH+6,AW,5);

function centerText(lines, y0, color, size){
  cx.font=(size||10)+'px "Press Start 2P"';
  cx.fillStyle=color||C.text;
  lines.forEach((l,i)=>{ const w=cx.measureText(l).width; cx.fillText(l,(W-w)/2,y0+i*(size?size*2:20)); });
}
/* mesmo contorno arco-íris das outras telas, desenhado à mão no canvas:
   8 cópias coloridas em volta do texto, com o matiz girando junto com `t` */
const RAINBOW_HUES=[0,45,90,135,180,225,270,315];
const RAINBOW_OFFS=[[0,-2],[1.6,-1.6],[2,0],[1.6,1.6],[0,2],[-1.6,1.6],[-2,0],[-1.6,-1.6]];
function rainbowText(lines, y0, size){
  const s=size||14;
  cx.font=s+'px "Press Start 2P"';
  lines.forEach((l,i)=>{
    const w=cx.measureText(l).width, x=(W-w)/2, y=y0+i*(s*2);
    RAINBOW_OFFS.forEach((o,idx)=>{
      cx.fillStyle=`hsl(${(t*1.5+RAINBOW_HUES[idx])%360},85%,65%)`;
      cx.fillText(l, x+o[0], y+o[1]);
    });
    cx.fillStyle='#fff';
    cx.fillText(l, x, y);
  });
}
function drawScoreBreakdown(y0){
  const rows=[['DESVIOS',stats.desvio],['CÓDIGO COLETADO',stats.coleta],['DESVIOS PERFEITOS',stats.perfeito],
              ['ESPECIAL',stats.especial],['CHEFE VENCIDO',stats.chefe]].filter(r=>r[1]>0);
  cx.font='7px "Press Start 2P"';
  rows.forEach((r,i)=>{
    cx.fillStyle=C.dim; cx.fillText(r[0], W/2-150, y0+i*16);
    cx.fillStyle=C.gold; const vs=String(r[1]);
    cx.fillText(vs, W/2+150-cx.measureText(vs).width, y0+i*16);
  });
}

/* ── tela de seleção ── */
function drawSelect(){
  drawBackground(1.0,t);
  centerText(['SHE RUNS'],52,C.violet,20);
  centerText(['escolha quem vai correr'],80,C.dim,6);

  cx.font='6px "Press Start 2P"'; cx.fillStyle=C.dim; cx.fillText(ch.era, bx+140, by+52);

  wrapText(ch.skill.why, bx+140, by+130, bw-160, 12);

  centerText(['ESPAÇO/W pular · S abaixar · A D ou ←→ andar/trocar · Z especial · L ranking'],by+bh+42,C.dim,6);
  cx.globalAlpha=.5+Math.sin(t*.15)*.5;
  centerText(['— TOQUE PRA COMEÇAR —'],by+bh+66,C.gold,8);
  cx.globalAlpha=1;
}
function wrapText(txt,x,y,maxW,lh){
  const words=txt.split(' '); let line='', yy=y;
  words.forEach(w=>{
    const test=line?line+' '+w:w;
    if(cx.measureText(test).width>maxW){ cx.fillText(line,x,yy); line=w; yy+=lh; }
    else line=test;
  });
  if(line) cx.fillText(line,x,yy);
}

/* ══════════ LEADERBOARD ══════════ */
const endBar=document.getElementById('endBar');
function showEndBar(){ endBar.style.display='flex'; document.getElementById('endStatus').textContent=''; document.getElementById('saveBtn').disabled=false; }
function hideEndBar(){ endBar.style.display='none'; }
async function sha256(msg){
  const data=new TextEncoder().encode(msg);
  const hash=await crypto.subtle.digest('SHA-256',data);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const name=(document.getElementById('pName').value||'AAA').trim().slice(0,3).toUpperCase().replace(/[^A-Z0-9]/g,'').padEnd(3,'A') || 'AAA';
  const st=document.getElementById('endStatus');
  document.getElementById('saveBtn').disabled=true; st.textContent='enviando...';
  try{
    const token=await sha256(name+score+SALT);
    const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),4000);
    const res=await fetch(WORKER_URL+'/scores',{ method:'POST',signal:ctrl.signal,
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,score,character:hero.id,token}) });
    clearTimeout(timer);
    const data=await res.json();
    if(res.status===429){
      st.textContent='MUITAS TENTATIVAS — ESPERA UM POUCO E TENTA DE NOVO.';
      document.getElementById('saveBtn').disabled=false;
    } else if(data.ok===false){
      st.textContent='NÃO FOI POSSÍVEL SALVAR O SCORE.';
      document.getElementById('saveBtn').disabled=false;
    } else {
      st.textContent=data.rank?('SALVO! POSIÇÃO #'+data.rank+' NO RANKING'):'SCORE SALVO.';
    }
  }catch(e){
    st.textContent='RANKING INDISPONÍVEL AGORA — TENTA DE NOVO DEPOIS.';
    document.getElementById('saveBtn').disabled=false;
  }
});

let lbData=null, lbStatus='', lbFrom='SELECT', lbPlaceholders=[];
function randName3(){
  const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  return L[Math.random()*26|0]+L[Math.random()*26|0]+L[Math.random()*26|0];
}
async function openLeaderboard(){
  lbFrom = state;
  state='LEADERBOARD'; lbData=null; lbStatus='carregando...';
  lbPlaceholders = Array.from({length:10}, ()=>({name:randName3(), score:0, character:'---'}));
  try{
    const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),4000);
    const res=await fetch(WORKER_URL+'/scores/top10',{signal:ctrl.signal});
    clearTimeout(timer);
    const data=await res.json();
    if(res.status===429){ lbData=[]; lbStatus='MUITOS PEDIDOS — ESPERA UM POUCO'; return; }
    lbData=data.scores||[];
    lbStatus='';
  }catch(e){
    lbData=[]; lbStatus='RANKING OFFLINE NO MOMENTO';
  }
}
document.getElementById('lbBtn').addEventListener('click', openLeaderboard);
document.getElementById('lbTopLink').addEventListener('click', openLeaderboard);
document.getElementById('lbEntryBtn').addEventListener('click', openLeaderboard);
document.getElementById('backBtn').addEventListener('click', ()=>{ if(state==='LEADERBOARD') state=lbFrom; });
/* mesmos botões ◀▶ servem pra trocar personagem na seleção (toque único)
   e pra mover na corrida (segurar = mover contínuo, igual segurar A/D) */
function cycleChar(dir){ const tot=CHARS.length; selIdx=(selIdx+dir+tot)%tot; SFX.select(); }
function sideNavDown(dir){
  if(state==='SELECT') cycleChar(dir);
  else if(state==='RUN') keys[dir<0?'ArrowLeft':'ArrowRight']=true;
}
function sideNavUp(dir){
  if(state==='RUN') keys[dir<0?'ArrowLeft':'ArrowRight']=false;
}
btn('btnCharPrev', ()=>sideNavDown(-1), ()=>sideNavUp(-1));
btn('btnCharNext', ()=>sideNavDown(1), ()=>sideNavUp(1));
function drawLeaderboard(){
  drawBackground(.5,t);
  rainbowText(['HALL DA FAMA'],48,14);
  if(lbData===null){
    centerText(['carregando...'],150,C.dim,8);
  } else {
    if(lbStatus){ centerText([lbStatus],68,C.dim,6); }
    const bx=W/2-220, by=88, bw=440;
    cx.font='6px "Press Start 2P"'; cx.fillStyle=C.dim;
    cx.fillText('#',bx,by); cx.fillText('NOME',bx+30,by); cx.fillText('PERSONAGEM',bx+220,by); cx.fillText('SCORE',bx+bw-50,by);
    for(let i=0;i<10;i++){
      const real = lbData[i];
      const row = real || lbPlaceholders[i];
      const y=by+24+i*20;
      cx.font='7px "Press Start 2P"'; cx.fillStyle = !real ? '#403a5c' : (i===0?C.gold:C.text);
      cx.fillText(String(i+1),bx,y);
      cx.fillText((row.name||'AAA').slice(0,3),bx+30,y);
      cx.font='6px "Press Start 2P"'; cx.fillStyle = !real ? '#302a44' : C.dim;
      cx.fillText(!real ? '---' : (row.character||'').slice(0,12),bx+220,y);
      cx.font='7px "Press Start 2P"'; cx.fillStyle = !real ? '#403a5c' : C.gold;
      const sc=String(row.score).padStart(5,'0');
      cx.fillText(sc,bx+bw-cx.measureText(sc).width,y);
    }
  }
  cx.globalAlpha=.5+Math.sin(t*.15)*.5;
  centerText(['ESPAÇO/TOQUE — VOLTAR'],H-20,C.dim,7);
  cx.globalAlpha=1;
}

/* ══════════ LOOP ══════════ */
const topbarEl=document.getElementById('topbar'), lbEntryBtn=document.getElementById('lbEntryBtn'),
      backBtn=document.getElementById('backBtn'), charNavBar=document.getElementById('charNavBar');
function frame(){
  t++;
  if(shake>0) shake--;
  if(flashRed>0) flashRed--;
  cx.save();
  if(shake>0) cx.translate((Math.random()-.5)*shake*2,(Math.random()-.5)*shake*2);

  // botão flutuante de ranking: só aparece quando a topbar (que já tem o link) some — telas curtas de celular
  lbEntryBtn.style.display=(state==='SELECT' && getComputedStyle(topbarEl).display==='none')?'block':'none';
  // voltar: visível sempre que dá pra voltar de onde se está (hoje só o ranking)
  backBtn.style.display=(state==='LEADERBOARD')?'block':'none';
  // setas ◀▶: trocam personagem na seleção, movem na corrida — só em telas de toque
  charNavBar.style.display=((state==='SELECT'||state==='RUN') && matchMedia('(pointer:coarse)').matches)?'block':'none';

  if(state==='SELECT') drawSelect();
  else if(state==='LEADERBOARD') drawLeaderboard();

  else if(state==='RUN'){
    drawBackground(RUN_CFG.speedBase+(RUN_CFG.speedMax-RUN_CFG.speedBase)*Math.min(1,progress/100),t);
    cx.font='7px "Press Start 2P"'; cx.fillStyle=C.dim; cx.fillText(hero.era,14,H-12);
    updateRun();
    if(state==='RUN'){
      drawObstacles();
      cx.save();
      if(player.shield||player.orbit>0){
        cx.strokeStyle=player.shield?C.good:hero.theme; cx.lineWidth=2;
        cx.globalAlpha=.4+Math.sin(t*.3)*.3;
        cx.strokeRect(player.x-HERO_W/2-4, player.y-HERO_H-4, HERO_W+8, HERO_H+8);
        cx.globalAlpha=1;
      }
      cx.restore();
      drawHero(hero,player.x,player.y,player.duck,player.legFrame,player.ground);
      drawParticlesTexts();
      drawHUD();
    }
  }
  else if(state==='BOSSINTRO'){ drawBackground(.4,t); drawBossScene(); textBox(boss.intro,true); }
  else if(state==='BOSSMENU'){ drawBackground(.4,t); drawBossScene(); drawBossMenu(); drawParticlesTexts(); }
  else if(state==='BOSSTEXT'){ drawBackground(.4,t); drawBossScene(); bossMsgTimer++; textBox([bossMsg],bossMsgTimer>40); drawParticlesTexts(); }
  else if(state==='BOSSDODGE'){ drawBackground(.4,t); drawBossScene(); updateDodge(); if(state==='BOSSDODGE') drawArena(); drawParticlesTexts(); }
  else if(state==='BOSSWIN'){ drawBackground(.6,t); drawBossScene(); textBox(boss.win,true); }

  else if(state==='VICTORY'){
    drawBackground(.8,t);
    centerText([hero.name+' VENCEU'],56,C.good,12);
    centerText(['SCORE: '+score],90,C.gold,10);
    drawScoreBreakdown(122);
    cx.globalAlpha=.5+Math.sin(t*.15)*.5;
    centerText(['TOQUE — OUTRA PERSONAGEM'],H-20,C.dim,6);
    cx.globalAlpha=1;
  }
  else if(state==='GAMEOVER'){
    drawBackground(.15,t);
    centerText(['BURNOUT'],H/2-110,C.bad,16);
    centerText(['Você precisou parar.','Não porque fraquejou.'],H/2-66,C.dim,7);
    centerText(['SCORE: '+score],H/2-18,C.gold,11);
    drawScoreBreakdown(H/2+14);
    cx.globalAlpha=.5+Math.sin(t*.15)*.5;
    centerText(['ESPAÇO/TOQUE — TENTAR DE NOVO'],H-20,C.text,8);
    cx.globalAlpha=1;
  }

  if(flashRed>0){ cx.fillStyle='rgba(255,93,108,.18)'; cx.fillRect(-10,-10,W+20,H+20); }
  cx.restore();
  requestAnimationFrame(frame);
}
frame();
